[package]
name = "adrena"
version = "1.3.7"
description = "Adrena"
authors = ["Corto <adrena.corto@gmail.com>", "Orex <adrena.orex@gmail.com"]
repository = "https://github.com/AdrenaFoundation/adrena"
categories = ["finance"]
keywords = [
    "adrena",
    "adx",
    "solana",
    "dex",
    "perpetuals",
    "futures",
    "exchange",
]
license = "Apache-2.0"
homepage = "hhttps://landing.adrena.xyz/"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "adrena"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = []
test = []
devnet = []
default = ["cpi"]

[dependencies]
libsecp256k1 = "0.7"
anchor-lang = { version = "=0.29.0", features = ["init-if-needed"] }
anchor-spl = "=0.29.0"
solana-program = "=1.18.22"
solana-security-txt = "1.1.1"
pyth-solana-receiver-sdk = "=0.3.1"
num-traits = "0.2.15"
num = "0.4.0"
bytemuck = { version = "1.15.0", features = ["derive", "min_const_generics"] }
spl-governance = { version = "4.0.0", features = ["no-entrypoint"] }
mpl-token-metadata = { version = "=4.1.2" }

[dev-dependencies]
hex = "0.4"
sha3 = "0.10"
colored = "=2.2.0"
ctor = "=0.2.9"
once_cell = "=1.20.2"
lazy_static = "=1.5.0"
solana-logger = "=1.18.22"
solana-program-test = "=1.18.22"
solana-sdk = "=1.18.22"
spl-associated-token-account = { version = "3.0.2", features = [
    "no-entrypoint",
] }
tokio = { version = "1.0.0", features = ["macros"] }
bincode = "1.3.3"
proptest = "1.1.0"
maplit = "1.0.2"
rand = "0.8.4"

name: trigger_liquidation_render

# Controls when the workflow will run
on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "target/**"
      - "programs/**"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  trigger_liquidation_render:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ADRENA_REPOSITORY_ACCESS_APP_ID }}
          private-key: ${{ secrets.ADRENA_REPOSITORY_ACCESS_APP_PRIVATE_KEY }}
          repositories: liquidation-render

      - name: Trigger Workflow in liquidation-render repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AdrenaFoundation/liquidation-render/dispatches \
            -d "{\"event_type\": \"trigger-workflow\", \"client_payload\": {\"unit\":false,\"integration\":true}"
